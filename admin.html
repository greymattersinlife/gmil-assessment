<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>GMIL Assessor / Admin Console</title><link rel="stylesheet" href="styles.css"><style>
.admin-table{width:100%;border-collapse:collapse}.admin-table th,.admin-table td{padding:10px;border-bottom:1px solid var(--line);text-align:left;font-size:.82rem;vertical-align:top}.admin-table th{color:var(--navy)}.flag{display:inline-block;padding:4px 7px;border-radius:999px;background:#fff3dc;color:#7b5d22;font-size:.7rem;margin:2px}.danger{background:#fdebea;color:#913f3d}.clickrow{cursor:pointer}.clickrow:hover{background:#f8fbfb}.login-card{max-width:560px;margin:5vh auto}.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.stat-card{padding:14px;border:1px solid var(--line);border-radius:14px;background:#fafcfc}.stat-card strong{display:block;font-size:1.35rem;color:var(--navy)}@media(max-width:850px){.stat-grid{grid-template-columns:1fr 1fr}}@media(max-width:520px){.stat-grid{grid-template-columns:1fr}}</style></head><body><div id="app"></div><script src="admin.js"></script></body></html>
